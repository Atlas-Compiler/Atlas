[project]
name = "atlascompiler"
version = "1.0.0"
description = "Official Atlas Python SDK"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
    "httpx==0.28.1",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
test = ["build==1.2.2.post1", "pytest==8.3.5"]

[project.urls]
Homepage = "https://github.com/Atlas-Compiler/Atlas"
Repository = "https://github.com/Atlas-Compiler/Atlas"
Issues = "https://github.com/Atlas-Compiler/Atlas/issues"
Discord = "https://discord.gg/z9ktRhuudq"
Documentation = "https://docs.atlas-compiler.com/sdk/python"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlascompiler"]

[tool.hatch.build.targets.wheel.force-include]
"src/atlascompiler/py.typed" = "atlascompiler/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
